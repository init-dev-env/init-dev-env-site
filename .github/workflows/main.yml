name: Publish Site
run-name: Publish site🏠 as developping pre-release version
on:
  repository_dispatch:
    types: [called-other-workflow]

jobs:
  Build-GitHub-Pages-Actions:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      # Add Secrets to Mask
      - name: Add Mask
        run: echo "::add-mask::${{ secrets.GITHUB_TOKEN }}"
      - name: Add Mask
        run: echo "::add-mask::${{ secrets.GH_PAT }}"
      - name: Add Mask
        run: echo "::add-mask::${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}"
      - name: Add Mask
        run: echo "::add-mask::${{ secrets.CLOUD_FLARE_TOKEN }}"
      - name: Add Mask
        run: echo "::add-mask::${{ secrets.CACHE_SERVER }}"

      # Add Secret Data to Step Output
      - name: Set OwnerName
        id: OwnerName
        run: echo "Name=${OWNER_NAME}" >> $GITHUB_OUTPUT
        env:
          OWNER_NAME: ${{ secrets.OWNER_NAME }}

      # Get RepoName only ("owner/reponame" => "reponame")
      - name: Get Repository Name only
        id: Repository
        run: echo "Name=${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}" >> $GITHUB_OUTPUT

      # Check out repository code
      - name: Check out self repository
        uses: actions/checkout@v7
        with:
          path: init-dev-env-site
          show-progress: false

      - name: Check out neighboring repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/init-dev-env-secret
          token: ${{ secrets.GH_PAT }}
          ref: ${{ vars.DEVELOP_BRANCH_NAME }}
          path: init-dev-env
          show-progress: false

      - name: Change Branch to develop
        run: |
          cd $GITHUB_WORKSPACE/${{ secrets.SITE_EXEC_REPO_NAME }}
          git config user.name actions-user
          git config user.email action@github.com
          git pull --all
          git checkout -b ${{ vars.DEVELOP_BRANCH_NAME }}

      - name: Make Index HTML File
        run: |
          cd $GITHUB_WORKSPACE/${{ secrets.SITE_EXEC_REPO_NAME }}
          mkdir -p site
          echo "<html>" > site/index.html
          echo "<head><title>init-dev-env</title></head>" >> site/index.html
          echo "<body>" >> site/index.html
          echo "<h1 style='font-size: 16px'>init-dev-env</h1>" >> site/index.html
          echo "Hello, World!" >> site/index.html
          echo "</body>" >> site/index.html
          echo "</html>" >> site/index.html
          echo "" >> site/index.html

      - name: Commit and Push to develop branch
        run: |
          cd $GITHUB_WORKSPACE/${{ secrets.SITE_EXEC_REPO_NAME }}
          git add .
          git commit -m "Add Index for develop"
          git push origin ${{ vars.DEVELOP_BRANCH_NAME }}

      - name: Add Doc File of Enchanted Chant with PowerShell
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}/${{ secrets.SITE_EXEC_REPO_NAME }}"
          New-Item -ItemType Directory site -Force -ErrorAction SilentlyContinue | Out-Null
          $Lines = [System.Collections.Generic.List[String]]::New()
          $Lines.Add('<html>')
          $Lines.Add('<head><title>init-dev-env</title></head>')
          $Lines.Add('<body>')
          $Lines.Add('<h1 style="font-size: 16px">Enchanted Chant</h1>')
          $Lines.Add('<div style="font-family: Consolas, monospace; font-size: 14px; border: 1px solid #999; border-radius: 8px; margin: 16px 4px; padding: 8px; background-color: #CCC">')
          $Lines.Add('<pre style="font-family: Consolas, monospace; font-size: 14px; border: 1px solid #999; border-radius: 8px; margin: 4px; padding: 8px 12px; background-color: #333; color: #EEE; line-height: 19px; letter-spacing: 0.5px;">')
          $Lines.Add('$ErrorActionPreference = "Stop"')
          $Lines.Add('$ProgressPreference = "SilentlyContinue"')
          $Lines.Add('$InstallDirPath = "C:\TempInstall\InstallScript"')
          $Lines.Add('$SevenZipExeFilePath = "$InstallDirPath\Lib\7z.exe"')
          $Lines.Add('$SevenZipDllFilePath = "$InstallDirPath\Lib\7z.dll"')
          $Lines.Add('$ArtifactArchiveFilePath = "$InstallDirPath\init-dev-env.7z"')
          $Lines.Add('$Pswd = Read-Host -Prompt "Key?"')
          $Lines.Add('New-Item -ItemType Directory -Path "$InstallDirPath\Lib" -Force -ErrorAction SilentlyContinue | Out-Null')
          $Lines.Add('Invoke-WebRequest -Uri https://raw.githubusercontent.com/init-dev-env/init-dev-env-act/refs/heads/${{ vars.DEVELOP_BRANCH_NAME }}/lib/7z.exe -OutFile "$SevenZipExeFilePath" -ErrorAction Stop | Out-Null')
          $Lines.Add('Invoke-WebRequest -Uri https://raw.githubusercontent.com/init-dev-env/init-dev-env-act/refs/heads/${{ vars.DEVELOP_BRANCH_NAME }}/lib/7z.dll -OutFile "$SevenZipDllFilePath" -ErrorAction Stop | Out-Null')
          $Lines.Add('Unblock-File "$SevenZipExeFilePath" | Out-Null')
          $Lines.Add('Unblock-File "$SevenZipDllFilePath" | Out-Null')
          $Lines.Add('Invoke-WebRequest https://github.com/init-dev-env/init-dev-env/releases/download/${{ vars.DEVELOP_BRANCH_NAME }}/init-dev-env.7z -OutFile "$ArtifactArchiveFilePath" -ErrorAction Stop | Out-Null')
          $Lines.Add('Unblock-File "$ArtifactArchiveFilePath" | Out-Null')
          $Lines.Add('Start-Process "$SevenZipExeFilePath" -ArgumentList "x `"$ArtifactArchiveFilePath`" -o`"$InstallDirPath`" -p$Pswd -x!Lib\7z.exe -x!Lib\7z.dll -y -sccWIN -scsUTF-8 -bso0 -bsp0 -bd" -Wait -NoNewWindow | Out-Null')
          $Lines.Add('Start-Process "C:\Windows\Explorer.exe" -ArgumentList "$InstallDirPath"')
          $Lines.Add('')
          $Lines.Add('</pre>')
          $Lines.Add('</div>')
          $Lines.Add('</body>')
          $Lines.Add('</html>')
          $Lines.Add('')
          $Lines | Out-File -FilePath site/${{ vars.TARGET_HTML_NAME }}

      - name: List site files
        run: |
          cd $GITHUB_WORKSPACE/${{ secrets.SITE_EXEC_REPO_NAME }}
          touch -d '2026-01-01 12:00:00.000000000' site/index.html
          touch -d '2026-01-01 12:00:00.000000000' site/${{ vars.TARGET_HTML_NAME }}
          ls -lsa site/

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ secrets.GH_PAT }}

      - name: Create Artifact for GitHub Pages
        id: DeployPagesArtifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ secrets.SITE_EXEC_REPO_NAME }}/site

      - name: Job summaries
        uses: actions/github-script@v9
        with:
          script: |
            await core.summary
              .addHeading("Build Site🎍Workflow has run✒", 3)
            .write()
            await core.notice("Site Content is written🚀")

  Deploy-And-Publish-GitHub-Pages-Actions:
    needs: Build-GitHub-Pages-Actions
    runs-on: ubuntu-latest
    permissions: write-all
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Artifact for GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Job summaries
        uses: actions/github-script@v9
        with:
          script: |
            await core.summary
              .addHeading("Launch Site🎍Workflow(1) is now completed☀", 3)
            .write()
            await core.notice("Site was deployed🚀")

  Deploy-And-Publish-CloudFlare-Pages-Actions:
    needs: Build-GitHub-Pages-Actions
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages

      - name: Extract Artifact
        run: |
          echo ${{ github.workspace }}
          ls -lsa ${{ github.workspace }}
          cd ${{ github.workspace }}
          mkdir -p "${{ secrets.SITE_EXEC_REPO_NAME }}/site"
          tar -x -f "artifact.tar" -C "${{ secrets.SITE_EXEC_REPO_NAME }}/site"
          echo ${{ github.workspace }}/${{ secrets.SITE_EXEC_REPO_NAME }}
          ls -lsa ${{ github.workspace }}/${{ secrets.SITE_EXEC_REPO_NAME }}
          echo ${{ github.workspace }}/${{ secrets.SITE_EXEC_REPO_NAME }}/site
          ls -lsa ${{ github.workspace }}/${{ secrets.SITE_EXEC_REPO_NAME }}/site

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUD_FLARE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          SITE_EXEC_REPO_NAME: ${{ secrets.SITE_EXEC_REPO_NAME }}
          DEVELOP_BRANCH_NAME: ${{ vars.DEVELOP_BRANCH_NAME }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          PROJECT_NAME="init-dev-env"
          PROJECT_URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"

          status=$(curl -sS -o /tmp/cf_project.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "${PROJECT_URL}")

          if [ "${status}" = "404" ]; then
            echo "Project does not exist; creating it..."
            cat > /tmp/cf_project_create.json <<EOF
          {
            "name": "${PROJECT_NAME}",
            "production_branch": "${DEVELOP_BRANCH_NAME}",
            "source": {
              "type": "github",
              "config": {
                "owner": "${OWNER_NAME}",
                "repo_name": "${SITE_EXEC_REPO_NAME}"
              }
            },
            "build_config": {
              "destination_dir": "site"
            }
          }
          EOF

            curl -sS -X POST \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @/tmp/cf_project_create.json \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"

            echo "Project creation requested."
            exit 0
          fi

          if [ "${status}" = "200" ]; then
            echo "Project already exists. Skipping create."
            exit 0
          fi

          echo "Unexpected Cloudflare API response while checking project status."
          echo "HTTP status: ${status}"
          cat /tmp/cf_project.json
          exit 1

      - name: Upload Files Pages Project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUD_FLARE_TOKEN }}
          workingDirectory: ${{ github.workspace }}/${{ secrets.SITE_EXEC_REPO_NAME }}
          command: |
            pages deploy site --project-name=init-dev-env --branch="${{ vars.DEVELOP_BRANCH_NAME }}"

      - name: Job summaries
        uses: actions/github-script@v9
        with:
          script: |
            await core.summary
              .addHeading("Launch Site🎍Workflow(2) Finished Running☀", 3)
            .write()
            await core.notice("Site was transfered☁☀")